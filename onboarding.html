<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hardwin — Thiết lập doanh nghiệp</title><link rel="stylesheet" href="business.css"><style>.onboard{max-width:760px;margin:60px auto;padding:24px}.step{display:none;border:1px solid var(--line);padding:24px;border-radius:16px;background:rgba(255,255,255,.03)}.step.active{display:block}.step h1{font-size:34px}.step label{display:block;color:var(--muted);font-size:12px;margin:15px 0 6px}.step input,.step select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text)}.steps{display:flex;gap:7px;margin:18px 0}.steps span{height:5px;flex:1;border-radius:99px;background:rgba(255,255,255,.08)}.steps span.active{background:var(--accent)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}</style></head>
<body><main class="onboard"><a class="brand" href="business.html">HARD<span>WIN</span></a><div class="steps"><span class="active"></span><span></span><span></span></div>
<section class="step active"><p class="panel-kicker">01 / BẮT ĐẦU</p><h1>Thiết lập workspace</h1><p>Phiên bản này là onboarding MVP và lưu tạm trên trình duyệt. Auth + database cloud sẽ được nối ở bước tiếp theo.</p><label>Tên doanh nghiệp</label><input id="company" placeholder="Ví dụ: Hardwin Media"><label>Loại tài khoản</label><select id="accountType"><option>Cá nhân</option><option>Doanh nghiệp</option></select><div class="actions"><a class="ghost-button" href="business.html">Bỏ qua</a><button class="primary-button" data-next>Tiếp theo →</button></div></section>
<section class="step"><p class="panel-kicker">02 / MỤC TIÊU</p><h1>Bạn muốn Hardwin giúp gì?</h1><label>Mục tiêu chính</label><select id="goal"><option>Tăng doanh thu</option><option>Giảm chi phí</option><option>Quản lý khách hàng</option><option>Tăng năng suất</option></select><div class="actions"><button class="ghost-button" data-prev>← Quay lại</button><button class="primary-button" data-next>Tiếp theo →</button></div></section>
<section class="step"><p class="panel-kicker">03 / HOÀN TẤT</p><h1>Sẵn sàng bắt đầu</h1><p id="summary"></p><button class="primary-button" id="finish">Vào Business OS ↗</button></section>
<script>
const steps=[...document.querySelectorAll(".step")], bars=[...document.querySelectorAll(".steps span")];let index=0;
function show(i){index=i;steps.forEach((s,n)=>s.classList.toggle("active",n===i));bars.forEach((b,n)=>b.classList.toggle("active",n<=i));}
document.querySelectorAll("[data-next]").forEach(b=>b.addEventListener("click",()=>{if(index===0)localStorage.setItem("hardwin_onboarding",JSON.stringify({company:company.value.trim()||"Doanh nghiệp của bạn",type:accountType.value}));if(index===1){const x=JSON.parse(localStorage.getItem("hardwin_onboarding")||"{}");x.goal=goal.value;localStorage.setItem("hardwin_onboarding",JSON.stringify(x));summary.textContent="Workspace: "+x.company+" • "+x.type+" • Mục tiêu: "+x.goal;}show(Math.min(2,index+1));}));
document.querySelector("[data-prev]").addEventListener("click",()=>show(Math.max(0,index-1)));
document.getElementById("finish").addEventListener("click",()=>location.href="business.html");
</script></main></body></html>
