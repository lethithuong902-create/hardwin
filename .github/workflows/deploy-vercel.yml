name: Deploy Hardwin to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get Hardwin code
        uses: actions/checkout@v4

      - name: Put Hardwin on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx vercel@latest --prod --yes --token="${VERCEL_TOKEN}"
